# Xcode project definition. The generated TimeCapsuleMusic.xcodeproj is committed, so you only
# need XcodeGen (`brew install xcodegen`) if you change this file: run `xcodegen` in the repo root.
name: TimeCapsuleMusic
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  TimeCapsuleKit:
    path: .
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  TimeCapsuleMusic:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - App/TimeCapsuleMusic
    dependencies:
      - package: TimeCapsuleKit
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: TC Music
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        # Keep playing (and loading the next song) with the screen locked.
        UIBackgroundModes:
          - audio
        NSLocalNetworkUsageDescription: TC Music connects to your Time Capsule on your home network to play your music.
        NSBonjourServices:
          - _adisk._tcp
          - _smb._tcp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.TimeCapsuleMusic
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
